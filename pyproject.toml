[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zero2researcher"
version = "0.1.0"
description = "Course toolkit for 'Zero2Researcher: From Zero Programming to Beginning AI Researcher'"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7", "scikit-learn>=1.3"]

[project.optional-dependencies]
dev = ["pytest", "nbmake", "nbformat", "nbclient", "ipykernel"]

[tool.setuptools.packages.find]
include = ["zero2researcher*"]

[tool.setuptools.package-data]
zero2researcher = ["datasets/*"]
