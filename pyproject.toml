[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zero2researcher"
version = "0.1.0"
description = "Course toolkit for 'Zero2Researcher: From Zero Programming to Beginning AI Researcher'"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7", "scikit-learn>=1.3"]

[project.optional-dependencies]
# torch/torchvision are needed to develop and CI-execute week 7+ notebooks,
# transformers/peft/torch_geometric/networkx for weeks 13-14; students don't need
# them in the base install (Colab ships torch and transformers; week 13-14
# notebooks install the rest in their first cell).
dev = ["pytest", "nbmake", "nbformat", "nbclient", "ipykernel", "torch", "torchvision",
       "transformers>=5.22,<6", "peft>=0.21,<1", "torch_geometric>=2.8,<3", "networkx",
       "datasets", "gymnasium>=1.4,<2", "anthropic"]

[tool.setuptools.packages.find]
include = ["zero2researcher*"]

[tool.setuptools.package-data]
zero2researcher = ["datasets/*"]
